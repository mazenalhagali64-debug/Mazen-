<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Web‑NetCheck – فحص الشبكة</title>
<style>
/* ---------- مظهر بسيط وأنيق ---------- */
body{
    font-family:"Segoe UI",Tahoma,Arial,sans-serif;
    background:#f4f7f9;
    margin:0;
    padding:0;
    direction:rtl;
    text-align:center;
    color:#333;
}
header{
    background:#005a9c;
    color:#fff;
    padding:1.5rem 0;
}
h1{margin:0;font-size:2rem;}
.container{
    max-width:800px;
    margin:2rem auto;
    background:#fff;
    padding:2rem;
    border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}
section{
    margin-bottom:1.5rem;
    text-align:left;
}
section h2{
    font-size:1.2rem;
    color:#005a9c;
    margin-bottom:.5rem;
}
button{
    padding:.6rem 1.2rem;
    font-size:1rem;
    margin-top:.5rem;
    cursor:pointer;
    background:#005a9c;
    color:#fff;
    border:none;
    border-radius:4px;
}
button:disabled{
    background:#aaa;
    cursor:not-allowed;
}
.result{
    margin-top:.5rem;
    padding:.8rem;
    background:#f0f4f8;
    border-radius:4px;
    font-family:monospace;
    white-space:pre-wrap;
    word-break:break-all;
}
footer{
    margin-top:2rem;
    color:#777;
    font-size:.9rem;
}
input[type=text]{
    padding:.4rem;
    font-size:1rem;
}
</style>
</head>
<body>
<header>
    <h1>Web‑NetCheck – فحص الشبكة</h1>
</header>

<div class="container">
    <!-- 1. اختبار الاتصال -->
    <section id="section-conn">
        <h2>1️⃣ اختبار الاتصال بالإنترنت</h2>
        <button id="btn-conn">ابدأ الفحص</button>
        <div class="result" id="res-conn"></div>
    </section>

    <!-- 2. قياس زمن الاستجابة (Ping) -->
    <section id="section-ping">
        <h2>2️⃣ قياس زمن الاستجابة (Ping تقريبي)</h2>
        <button id="btn-ping">ابدأ القياس</button>
        <div class="result" id="res-ping"></div>
    </section>

    <!-- 3. فحص DNS عبر HTTPS -->
    <section id="section-dns">
        <h2>3️⃣ فحص DNS (DNS‑over‑HTTPS)</h2>
        <input type="text" id="dns-domain" placeholder="أدخل اسم النطاق (مثال: google.com)">
        <button id="btn-dns">تحقق</button>
        <div class="result" id="res-dns"></div>
    </section>

    <!-- 4. اختبار سرعة التحميل -->
    <section id="section-speed">
        <h2>4️⃣ اختبار سرعة التحميل (Download)</h2>
        <button id="btn-speed">ابدأ الاختبار</button>
        <div class="result" id="res-speed"></div>
    </section>

    <!-- 5. إظهار الـ IP العام -->
    <section id="section-ip">
        <h2>5️⃣ إظهار عنوان IP العام</h2>
        <button id="btn-ip">عرض IP</button>
        <div class="result" id="res-ip"></div>
    </section>

    <!-- 6. إظهار الـ IP المحلي (WebRTC) -->
    <section id="section-localip">
        <h2>6️⃣ إظهار عنوان IP المحلي (إن وجد)</h2>
        <button id="btn-localip">اكتشف IP المحلي</button>
        <div class="result" id="res-localip"></div>
    </section>
</div>

<footer>© 2026 Web‑NetCheck – جميع الحقوق محفوظة.</footer>

<script>
/* -------------------------------------------------
   Utility helpers
   ------------------------------------------------- */
function logResult(el, txt){ el.textContent = txt; }
function formatBytes(bytes){
    const units = ['بايت','KB','MB','GB','TB'];
    let i = 0;
    while (bytes >= 1024 && i < units.length-1){
        bytes /= 1024; i++;
    }
    return `${bytes.toFixed(2)} ${units[i]}`;
}

/* -------------------------------------------------
   1️⃣ اختبار الاتصال
   ------------------------------------------------- */
document.getElementById('btn-conn').addEventListener('click', async ()=>{
    const out = document.getElementById('res-conn');
    logResult(out,'جاري الفحص…');
    try{
        // Google 204 لا يُعيد محتوى ولا يتطلب CORS
        await fetch('https://www.google.com/generate_204',{mode:'no-cors'});
        logResult(out,'✅ الاتصال بالإنترنت متاح.');
    }catch(e){
        logResult(out,`❌ فشل الاتصال: ${e}`);
    }
});

/* -------------------------------------------------
   2️⃣ قياس زمن الاستجابة (Ping تقريبي)
   ------------------------------------------------- */
document.getElementById('btn-ping').addEventListener('click', async ()=>{
    const out = document.getElementById('res-ping');
    logResult(out,'جاري قياس زمن الاستجابة…');
    try{
        const url = 'https://www.cloudflare.com/cdn-cgi/trace';
        const start = performance.now();
        await fetch(url,{cache:'no-store'});   // منع التخزين المؤقت
        const end = performance.now();
        const ms = (end-start).toFixed(1);
        logResult(out,`⏱ زمن الاستجابة ≈ ${ms} ملّي ثانية`);
    }catch(e){
        logResult(out,`❌ لا يمكن قياس زمن الاستجابة: ${e}`);
    }
});

/* -------------------------------------------------
   3️⃣ فحص DNS عبر DNS‑over‑HTTPS
   ------------------------------------------------- */
document.getElementById('btn-dns').addEventListener('click', async ()=>{
    const domain = document.getElementById('dns-domain').value.trim();
    const out = document.getElementById('res-dns');
    if(!domain){
        logResult(out,'⚠️ أدخل اسم نطاق أولاً.');
        return;
    }
    logResult(out,`جاري الاستعلام عن DNS لـ "${domain}"…`);
    try{
        const dnsURL = `https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(domain)}&type=A`;
        const resp = await fetch(dnsURL,{
            headers:{'Accept':'application/dns-json'}
        });
        if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        if(data.Status !== 0){
            logResult(out,`❌ فشل الاستعلام: رمز الحالة ${data.Status}`);
            return;
        }
        const ips = data.Answer?.filter(a=>a.type===1).map(a=>a.data) ?? [];
        if(ips.length===0) logResult(out,'⚠️ لا توجد سجلات A لهذا النطاق.');
        else logResult(out,`✅ عناوين IP لـ ${domain}:\n${ips.join('\n')}`);
    }catch(e){
        logResult(out,`❌ خطأ في استعلام DNS: ${e}`);
    }
});

/* -------------------------------------------------
   4️⃣ اختبار سرعة التحميل
   ------------------------------------------------- */
document.getElementById('btn-speed').addEventListener('click', async ()=>{
    const out = document.getElementById('res-speed');
    logResult(out,'جاري اختبار سرعة التحميل…');
    try{
        const fileURL = `https://speed.hetzner.de/10MB.bin?${Date.now()}`;
        const start = performance.now();
        const resp = await fetch(fileURL);
        const reader = resp.body.getReader();
        let received = 0;
        while(true){
            const {done,value} = await reader.read();
            if(done) break;
            received += value.byteLength;
        }
        const end = performance.now();
        const secs = (end-start)/1000;
        const bps = received / secs;
        logResult(out,
            `✅ تم التحميل ${formatBytes(received)} في ${secs.toFixed(2)} ث\n`+
            `🚀 سرعة التحميل ≈ ${formatBytes(bps)}/ث`);
    }catch(e){
        logResult(out,`❌ فشل اختبار السرعة: ${e}`);
    }
});

/* -------------------------------------------------
   5️⃣ إظهار الـ IP العام
   ------------------------------------------------- */
document.getElementById('btn-ip').addEventListener('click', async ()=>{
    const out = document.getElementById('res-ip');
    logResult(out,'جاري جلب عنوان IP العام…');
    try{
        const resp = await fetch('https://api.ipify.org?format=json');
        const data = await resp.json();
        logResult(out,`🌐 عنوان IP العام: ${data.ip}`);
    }catch(e){
        logResult(out,`❌ لا يمكن جلب IP العام: ${e}`);
    }
});

/* -------------------------------------------------
   6️⃣ إظهار الـ IP المحلي عبر WebRTC
   ------------------------------------------------- */
document.getElementById('btn-localip').addEventListener('click', async ()=>{
    const out = document.getElementById('res-localip');
    logResult(out,'جاري استخراج IP المحلي…');
    const ips = new Set();
    const pc = new RTCPeerConnection({iceServers:[]});

    // إنشاء قناة بيانات لتفعيل ICE
    pc.createDataChannel('dummy');

    // معالجة المرشحات (candidates)
    pc.addEventListener('icecandidate', e=>{
        if(!e.candidate) return; // نهاية المرشحات
        const candidate = e.candidate.candidate;
        const ipRegex = /([0-9]{1,3}\.){3}[0-9]{1,3}|([0-9a-fA-F]{0,4}:){1,7}[0-9a-fA-F]{0,4}/;
        const match = candidate.match(ipRegex);
        if(match) ips.add(match[0]);
    });

    // انتظر إكمال التجميع (أو حد زمني)
    const timeout = setTimeout(()=>{
        pc.close();
        if(ips.size===0)
            logResult(out,'⚠️ لم يُستخرج أي IP محلي (قد يكون المتصفح يمنع ذلك).');
        else
            logResult(out,`📡 عناوين IP المحلية:\n${[...ips].join('\n')}`);
    },5000);

    try{
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
    }catch(e){
        clearTimeout(timeout);
        pc.close();
        logResult(out,`❌ فشل استخراج IP المحلي: ${e}`);
    }
});
</script>
</body>
</html>
