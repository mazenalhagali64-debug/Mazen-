name: build-apk-test

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: اسم التطبيق
        default: مجلس النماذج
      app_id:
        description: معرّف التطبيق (حروف إنجليزية صغيرة ونقط)
        default: com.html2apk.majlis
      html_file:
        description: مسار ملف HTML بالريبو
        default: index.html

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android project
        env:
          APP_NAME: ${{ inputs.app_name }}
          APP_ID: ${{ inputs.app_id }}
          HTML_FILE: ${{ inputs.html_file }}
        run: |
          set -e
          test -f "$HTML_FILE" || { echo "ملف HTML مو موجود: $HTML_FILE"; exit 1; }
          [[ "$APP_ID" =~ ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$ ]] || { echo "معرّف التطبيق غلط: $APP_ID"; exit 1; }

          mkdir -p android/app/src/main/assets android/app/src/main/java/com/html2apk/app android/app/src/main/res/values android/app/src/main/res/mipmap-xxxhdpi
          cp "$HTML_FILE" android/app/src/main/assets/index.html

          if [ -f icon.png ]; then
            cp icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            ICON='@mipmap/ic_launcher'
          else
            ICON='@android:drawable/sym_def_app_icon'
          fi

          SAFE_NAME=$(printf '%s' "$APP_NAME" | sed 's/&/\&amp;/g; s/</\&lt;/g')
          printf '<resources><string name="app_name">%s</string></resources>' "$SAFE_NAME" > android/app/src/main/res/values/strings.xml

          cd android

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "app"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.html2apk.app'
            compileSdk 34
            defaultConfig {
              applicationId 'APP_ID_PLACEHOLDER'
              minSdk 24
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          EOF
          sed -i "s|APP_ID_PLACEHOLDER|$APP_ID|" app/build.gradle

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <application
                  android:label="@string/app_name"
                  android:icon="ICON_PLACEHOLDER"
                  android:usesCleartextTraffic="true"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          sed -i "s|ICON_PLACEHOLDER|$ICON|" app/src/main/AndroidManifest.xml

          cat > app/src/main/java/com/html2apk/app/MainActivity.java <<'EOF'
          package com.html2apk.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowFileAccessFromFileURLs(true);
                  s.setAllowUniversalAccessFromFileURLs(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient());
                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
